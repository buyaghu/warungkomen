// ---------------------------------------------------------------------
//  seeded RNG
// ---------------------------------------------------------------------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash(...xs) {
  let h = 2166136261 >>> 0;
  for (const x of xs) {
    const s = String(x);
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    h ^= 124; h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function RNG(...xs) {
  const f = mulberry32(hash(...xs));
  return {
    f,
    r: (a, b) => a + (b - a) * f(),
    n: (amt) => (f() * 2 - 1) * amt,
    i: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
  };
}

// ---------------------------------------------------------------------
//  math
// ---------------------------------------------------------------------
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
// has absolute time t reached cut time c? (cuts snap to the nearest frame, like shot boundaries)
const past = (t, c) => Math.round(t * FPS + 1e-6) >= Math.round(c * FPS);
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const EZ = {
  o2: (t) => 1 - (1 - clamp(t)) ** 2,
  o3: (t) => 1 - (1 - clamp(t)) ** 3,
  i2: (t) => clamp(t) ** 2,
  i3: (t) => clamp(t) ** 3,
  io: (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2; },
  back: (t) => { t = clamp(t) - 1; return 1 + 2.70158 * t * t * t + 1.70158 * t * t; },

function ellipsePts(cx, cy, rx, ry, rot = 0, n = 64, a0 = 0, a1 = TAU) {
  const P = [], c = Math.cos(rot), s = Math.sin(rot), full = Math.abs(a1 - a0 - TAU) < 1e-6;
  for (let i = 0; i < n; i++) {
    const a = a0 + (a1 - a0) * i / (full ? n : n - 1);
    const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    P.push([cx + x * c - y * s, cy + x * s + y * c]);
  }
  return P;
}
function rrectPts(x, y, w, h, r, n = 6) {
  r = Math.min(r, w / 2, h / 2);
  const P = [], cs = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of cs) for (let i = 0; i <= n; i++) { const a = a0 + (Math.PI / 2) * i / n; P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return P;
}
function arcPts(cx, cy, r, a0, a1, n = 18, sy = 1) {
  const P = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * sy]); }
  return P;
}
function xform(P, tx, ty, rot = 0, sx = 1, sy = sx) {
  const c = Math.cos(rot), s = Math.sin(rot);
  return P.map(([x, y]) => [tx + x * sx * c - y * sy * s, ty + x * sx * s + y * sy * c]);
}
function bbox(P, pad = 0) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of P) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
  return { x0: x0 - pad, y0: y0 - pad, x1: x1 + pad, y1: y1 + pad };
}
function resample(P, closed, step) {

  for (let i = 0; i < m; i++) {
    const a = P[i], b = P[(i + 1) % n], k = Math.max(1, Math.ceil(dist(a, b) / step));
    for (let j = 0; j < k; j++) out.push([a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k]);
  }

}
function pathLen(P) { let L = 0; for (let i = 1; i < P.length; i++) L += dist(P[i - 1], P[i]); return L; }
function subPath(P, frac) {
  let want = pathLen(P) * clamp(frac);

    const d = dist(P[i - 1], P[i]);
    if (want >= d) { out.push(P[i]); want -= d; }
    else { const k = want / (d || 1); out.push([lerp(P[i - 1][0], P[i][0], k), lerp(P[i - 1][1], P[i][1], k)]); break; }
  }

}
function pointAt(P, frac) { const S = subPath(P, frac); return S[S.length - 1]; }

// ---------------------------------------------------------------------
//  drawing kit — boil, sketchy lines, hatching, stipple, pencil, grain
// ---------------------------------------------------------------------
// smooth hand wobble along the normal; reseeded every boil step
function wobble(P, closed, amt, key, step = 7) {
  const Q = resample(P, closed, step), n = Q.length;
  const R = RNG('wob', key, B);
  const f1 = R.r(0.012, 0.03), f2 = R.r(0.05, 0.1), p1 = R.r(0, TAU), p2 = R.r(0, TAU);
  const sx = R.n(amt * 0.5), sy = R.n(amt * 0.5);
  const out = new Array(n); let s = 0;
  for (let i = 0; i < n; i++) {
    const a = Q[closed ? (i - 1 + n) % n : Math.max(0, i - 1)], b = Q[closed ? (i + 1) % n : Math.min(n - 1, i + 1)];
    const nx = a[1] - b[1], ny = b[0] - a[0], l = Math.hypot(nx, ny) || 1;
    if (i) s += dist(Q[i - 1], Q[i]);
    const o = amt * (0.75 * Math.sin(s * f1 + p1) + 0.35 * Math.sin(s * f2 + p2));
    out[i] = [Q[i][0] + nx / l * o + sx, Q[i][1] + ny / l * o + sy];
  }
  return out;
}
function trace(P, closed) {
  ctx.beginPath();
  const n = P.length; if (n < 2) return;
  if (closed) {
    ctx.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);
    for (let i = 0; i < n; i++) { const p = P[i], q = P[(i + 1) % n]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.closePath();
  } else {
    ctx.moveTo(P[0][0], P[0][1]);
    for (let i = 1; i < n - 1; i++) { const p = P[i], q = P[i + 1]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.lineTo(P[n - 1][0], P[n - 1][1]);
  }
}
// sketchy stroke. o: closed, color, w, amt, key, alpha, frac (write-on), double
function ink(P, o = {}) {
  const closed = !!o.closed, key = o.key ?? 'ink';
  let Q = o.raw ? P : wobble(P, closed, o.amt ?? 1.8, key);

function tag(str, x, y, size, o = {}) {   // a torn paper tag with handwriting
  const w = handW(str, size) + size * 0.9, h = size * 1.45;
  const ts = o.s ?? 1; if (ts <= 0.01) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot ?? -0.03); ctx.scale(ts, ts);
  cut(rect(-w / 2, -h / 2, w, h, 3), o.fill ?? PAL.paper, { key: 'tag' + str, tear: 1.6 });
  if (o.tape !== false) cut(rect(-34, -h / 2 - 16, 68, 30, 2), 'rgba(240,230,190,0.75)', { key: 'tape' + str, shadow: false, grain: 0.3, shade: false });
  handText(str, -w / 2 + size * 0.45, size * 0.36, size, o.color ?? PAL.ink, { key: 'tagt' + str, frac: o.frac });
  ctx.restore();
}
// tag and caption sit inside the format's safe area (9:16: y 330 and 1440)
const yearTag = (str) => { const f = () => tag(str, 70 + (handW(str, 80) + 72) / 2, SAFE.top + 90, 80, { rot: -0.04, s: popS(E0 + 0.2) }); if (DEFER) DEFER.push(f); else f(); };
const capStrip = (str) => { const f = () => tag(str, CX, H - SAFE.bottom - 60, 50, { rot: 0.012, tape: false, frac: ev(E0 + 0.45, 0.6) }); if (DEFER) DEFER.push(f); else f(); };

// =====================================================================
//  STYLE — the hooks the renderer (kit/morph.js) calls. Every styles/<name>/kit.js defines one.
//    paper            the blank sheet a morph happens on
//    backdrop(c)      fill the frame with colour c (behind a morph window)
//    window(P, key, src)  draw canvas src seen through outline P (screen coords): here a torn paper hole
//    blob(P, c, key)  the morphing shape itself, outline P, colour c
//    hero(x, y, r, o) the hero drawn by hero-to-hero bridges (SP(...) shapes); heroColor / heroPts for its outline
//    post()           after every frame (grain, print pass, upscale ...)
//    ones             true = motion on 1s (TT = every frame); default on 2s
// =====================================================================
const STYLE = {
  name: 'cut-paper',
  paper: '#efe5cf',
  backdrop(c) { cut(rect(-30, -30, W + 60, H + 60, 0), c, { key: 'backdrop', shadow: false, tear: 0, grain: 0.8, shade: false }); },
  window(P, key, src) {   // the world seen through a hand-cut window: torn edge, paper rim, shadow
    const Q = torn(wobble(P, true, 3, key, 9), key, 2.4);
    ctx.save(); ctx.shadowColor = 'rgba(35,20,10,0.35)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6; trace(Q, true); ctx.fillStyle = STYLE.paper; ctx.fill(); ctx.restore();
    ctx.save(); trace(Q, true); ctx.clip(); ctx.drawImage(src, 0, 0); ctx.restore();
    ctx.save(); trace(Q, true); ctx.strokeStyle = '#fbf6ea'; ctx.lineWidth = 7; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
  },
  blob(P, c, key) { cut(P, c, { key, tear: 1.0, amt: 1.2 }); },
  hero(x, y, r, o) { spark(x, y, r, o); },
  heroColor: PAL.orange,
  post() { grain({ n: 3000 }); },
};
// =====================================================================
//  SCENES — Warung Netizen Day 1. One function per shot, world coords 1080x1920, animated with TT / ev / popS
//  and cued from the voice (VW). Every scene: a full-bleed world, Mas Juned (or his hand) acting, 3+ details of
//  background life, hand-lettered text on paper. Orange (PAL.orange) = Juned's apron and the warung only.
// =====================================================================
// "cerah & ngejreng": saturated, spanduk/sticker colours. The hero orange gets punchier too (still reserved).
PAL.orange = '#ff6a2b'; PAL.orangeD = '#d8461a'; PAL.yellow = '#ffd23f'; PAL.pink = '#ff7eb6'; PAL.purple = '#8f5cff';
PAL.green = '#3fbf4f'; PAL.greenD = '#23943a'; PAL.blue = '#2f6fe0'; PAL.teal = '#14b3a8'; PAL.mustard = '#ffb703';
const WN = {   // piece colours (orange stays reserved)
  shirt: '#12b5a5', pants: '#2b3a9a', hair: '#1c1412', towel: '#ffffff', towelS: '#2f6fe0', red: '#ee2f2f', chalk: '#17614a',
  dusk1: '#ffa630', dusk2: '#ff4f8b', dusk3: '#5b2bb5', grass: '#46c24a', road: '#ffd08a', cart: '#1f7ae0', cartD: '#1559ad',
  skyA: '#3ec4f5', skyB: '#b8ecff', sun1: '#ffe14d', sun2: '#ffc21a',
};
// a sunburst (spanduk rays) behind a scene: alternating wedges from (cx, cy)
function sunburst(cx, cy, c1, c2, n = 18, key = 'sb') {
  cut(rect(-30, -30, W + 60, H + 60, 0), c1, { key, shadow: false, tear: 0, shade: false, grain: 0.6, pat: () => {
    ctx.fillStyle = c2; const r0 = (TT * 0.15) % (TAU / n), R = 2400;
    for (let i = 0; i < n; i += 1) { if (i % 2) continue; const a0 = r0 + i / n * TAU, a1 = a0 + TAU / n; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a0) * R, cy + Math.sin(a0) * R); ctx.lineTo(cx + Math.cos(a1) * R, cy + Math.sin(a1) * R); ctx.closePath(); ctx.fill(); }
  } });
}

// ---- MAS JUNED: full body, feet at (x, y). pose: 'stand' | 'scratch' | 'wave' | 'hold' | 'point' | 'hammer' | 'proud'
//      mood: face() moods. o.hat = 'chef' (the dream). Idle: a small bob and a blink.
function juned(x, y, s, o = {}) {
  const key = o.key ?? 'jn', pose = o.pose ?? 'stand', skin = PAL.skin2;
  const ph = key.length * 1.3, bob = Math.sin(TT * TAU * 0.8 + ph) * 4 * s;
  let mood = o.mood ?? 'smile';
  if (mood !== 'happy' && mood !== 'focus' && (B + Math.round(ph * 7)) % 41 < 2) mood = 'focus';   // blink
  const sx = (v) => x + v * s, sy = (v) => y + v * s + (v < -150 ? bob : 0);
  // legs + sandals
  [-1, 1].forEach((d) => {
    cut(capsulePts(sx(d * 38), sy(-210), sx(d * 42), sy(-28), 58 * s), WN.pants, { key: key + 'leg' + d, sb: 6 });
    cut(ellipsePts(sx(d * 50), sy(-14), 42 * s, 16 * s, 0, 18), '#6b4a34', { key: key + 'sd' + d, sb: 4 });
  });
  // arms behind the body for some poses are drawn after; shoulders
  const SH = [[sx(-104), sy(-400)], [sx(104), sy(-400)]];
  const HANDS = {
    stand:   [[-150, -230], [150, -230]],
    scratch: [[-150, -230], [70, -590]],
    wave:    [[-150, -230], [210, -600 + Math.sin(TT * 9) * 30]],
    hold:    [[-70, -300], [70, -300]],
    point:   [[-150, -230], [230, -420]],
    hammer:  [[-150, -230], [200, -470 + Math.abs(Math.sin(TT * 7)) * -90]],
    proud:   [[-110, -330], [110, -330]],
  }[pose];
  const hp = HANDS.map(([hx, hy]) => [sx(hx), sy(hy)]);
  const arm = (i) => {
    cut(capsulePts(SH[i][0], SH[i][1], hp[i][0], hp[i][1], 50 * s), WN.shirt, { key: key + 'arm' + i, sb: 6, pat: pat.stripes('rgba(255,255,255,0.16)', 6, 22) });
    cut(ellipsePts(hp[i][0], hp[i][1], 30 * s, 28 * s, 0, 16), skin, { key: key + 'hand' + i, sb: 4 });
  };
  // torso (kaos teal, striped)
  cut(rect(sx(-112), sy(-440), 224 * s, 270 * s, 70 * s), WN.shirt, { key: key + 'torso', pat: pat.stripes('rgba(255,255,255,0.16)', 6, 22) });
  // THE APRON (the hero colour)
  cut([[sx(-78), sy(-405)], [sx(78), sy(-405)], [sx(96), sy(-150)], [sx(-96), sy(-150)]], PAL.orange, { key: key + 'apron', crayon: PAL.orangeD, crAl: 0.35, crPer: 30, sb: 6 });
  cut(rect(sx(-46), sy(-270), 92 * s, 60 * s, 8 * s), PAL.orangeD, { key: key + 'pocket', shadow: false, grain: 0.5 });
  ink([[sx(-30), sy(-250)], [sx(30), sy(-250)]], { w: 3 * s, color: 'rgba(255,240,220,0.7)', amt: 0.4, key: key + 'stitch' });
  if (pose !== 'hold' && pose !== 'proud') { arm(0); arm(1); }
  // the towel round the neck (white with blue stripes), one end hanging
  cut(capsulePts(sx(-92), sy(-425), sx(92), sy(-425), 46 * s), WN.towel, { key: key + 'towel', sb: 5, pat: pat.stripes(WN.towelS, 6 * s, 30 * s, Math.PI / 2) });
  cut(capsulePts(sx(-60), sy(-420), sx(-70), sy(-320), 40 * s), WN.towel, { key: key + 'towelE', sb: 5, pat: pat.stripes(WN.towelS, 6 * s, 30 * s, 0) });
  // head
  cut(rect(sx(-22), sy(-470), 44 * s, 50 * s, 10 * s), skin, { key: key + 'neck', shadow: false });
  cut(ellipsePts(sx(-82), sy(-540), 14 * s, 20 * s, 0, 14), skin, { key: key + 'earL' });
  cut(ellipsePts(sx(82), sy(-540), 14 * s, 20 * s, 0, 14), skin, { key: key + 'earR' });
  cut(ellipsePts(sx(0), sy(-545), 84 * s, 90 * s, 0, 30), skin, { key: key + 'head' });
  // messy hair with a tuft that sways
  const tuft = Math.sin(TT * 5 + ph) * 8 * s;
  cut([[sx(-88), sy(-550)], [sx(-90), sy(-600)], [sx(-60), sy(-640)], [sx(-10), sy(-655)], [sx(10) + tuft, sy(-700)], [sx(30), sy(-650)],
       [sx(70), sy(-635)], [sx(92), sy(-590)], [sx(86), sy(-555)], [sx(60), sy(-600)], [sx(10), sy(-610)], [sx(-50), sy(-600)]], WN.hair, { key: key + 'hair', sb: 4 });
  if (o.hat === 'chef') {
    cut(rect(sx(-70), sy(-650), 140 * s, 50 * s, 6 * s), '#ffffff', { key: key + 'hatB', sb: 5 });
    [-50, 0, 50].forEach((d, i) => cut(ellipsePts(sx(d), sy(-700), 48 * s, 52 * s, 0, 22), '#ffffff', { key: key + 'hat' + i, sb: 4 }));
  }
  // eyebrows tell the mood
  const bt = mood === 'sad' ? 8 : mood === 'wow' ? -10 : 0;
  ink([[sx(-36), sy(-575 - bt * 0.3)], [sx(-12), sy(-578 + bt)]], { w: 5 * s, color: WN.hair, amt: 0.3, key: key + 'brL' });
  ink([[sx(12), sy(-578 + bt)], [sx(36), sy(-575 - bt * 0.3)]], { w: 5 * s, color: WN.hair, amt: 0.3, key: key + 'brR' });
  face(sx(0), sy(-540), 1.35 * s, mood);
  if (pose === 'hold' || pose === 'proud') { arm(0); arm(1); }
  return hp;   // hand positions, for props
}

// ---- shared props
function sky(c1, c2, key) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2);
  cut(rect(-30, -30, W + 60, H + 60, 0), c1, { key, shadow: false, tear: 0, shade: false, grain: 0.6, pat: () => { ctx.fillStyle = g; ctx.fillRect(-30, -30, W + 60, H + 60); } });
}
function ground(y, c, key, o = {}) { cut([[-40, y + 20], [300, y - 10], [700, y + 15], [1120, y - 5], [1120, H + 40], [-40, H + 40]], c, { key, sy: -4, pat: o.pat ?? pat.stripes('rgba(255,255,255,0.10)', 4, 24, 0.25) }); }
function cloud(x, y, s, key) { [[0, 0, 70, 34], [-55, 12, 48, 26], [55, 10, 52, 28]].forEach(([dx, dy, rx, ry], i) => cut(ellipsePts(x + dx * s, y + dy * s, rx * s, ry * s, 0, 22), '#ffffff', { key: key + i, sb: 6, shadow: i === 0 })); }
function birdsOnWire(y, key) {
  ink([[-20, y], [400, y + 30], [1100, y - 10]], { w: 3, color: PAL.ink, amt: 0.4, key: key + 'w' });
  [[180, 0], [240, 4], [300, 8]].forEach(([bx, d], i) => {
    const hop = (B + i * 5) % 29 < 2 ? -8 : 0;
    cut(ellipsePts(bx, y + 14 + d - 18 + hop, 22, 17, 0, 16), PAL.navy, { key: key + 'b' + i, sb: 3 });
    dot(bx + 10, y + d - 8 + hop, 3, '#fff');
  });
}
function leaf(x, y, a, key, c = PAL.green) { cut(rot(ellipsePts(x, y, 26, 11, 0, 14), x, y, a), c, { key, sb: 4 }); }
function fly(x0, y0, key) { const x = x0 + Math.sin(TT * 5.3) * 60, y = y0 + Math.sin(TT * 8.1) * 30; dot(x, y, 6, PAL.ink); ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(x - 5, y - 8, 7, 4, -0.5, 0, TAU); ctx.ellipse(x + 5, y - 8, 7, 4, 0.5, 0, TAU); ctx.fill(); }
// the cart (gerobak): body, glass case, roof, wheels. o.tilt rotates it on its right wheel (the bent wheel)
function gerobak(x, y, s, o = {}) {
  const key = o.key ?? 'gb', parts = o.parts ?? 9;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.tilt ?? 0); ctx.scale(s, s);
  if (parts >= 3) { [-170, 170].forEach((dx, i) => cut(rect(dx - 10, -560, 20, 360, 4), PAL.woodD, { key: key + 'post' + i })); }
  if (parts >= 4) cut([[-240, -560], [240, -560], [270, -620], [-270, -620]], o.roof ?? WN.red, { key: key + 'roof', pat: pat.stripes('rgba(255,255,255,0.35)', 22, 60), sb: 8 });
  if (parts >= 1) cut(rect(-230, -230, 460, 170, 10), WN.cart, { key: key + 'body', pat: pat.lines('rgba(255,255,255,0.18)', 34, 12) });
  if (parts >= 5) { cut(rect(-200, -380, 400, 150, 8), 'rgba(220,240,250,0.55)', { key: key + 'glass', sb: 6 }); ink([[-150, -360], [-110, -250]], { w: 6, color: 'rgba(255,255,255,0.8)', key: key + 'shine' }); }
  if (parts >= 2) { [[-150, 0], [150, 0]].forEach(([dx], i) => { cut(ellipsePts(dx, -50, 52, 52, 0, 26), PAL.charcoal, { key: key + 'wh' + i }); dot(dx, -50, 14, '#c9c2b5'); }); }
  if (parts >= 1) cut(capsulePts(225, -120, 320, -135, 20), PAL.woodD, { key: key + 'handle' });
  if (o.sign) { cut(rect(-160, -170, 320, 70, 6), PAL.orange, { key: key + 'sign', crayon: PAL.orangeD, crAl: 0.3, sb: 4 }); handText(o.sign, -handW(o.sign, 46) / 2, -122, 46, '#fff8ea', { key: key + 'signT', weight: 700 }); }
  ctx.restore();
}
// a paper card with a big handwritten line (for signs and boards)
function card(str, x, y, size, fill, o = {}) { tag(str, x, y, size, { fill, tape: o.tape ?? false, rot: o.rot ?? 0, s: o.s ?? 1, frac: o.frac, color: o.color }); }
// =====================================================================
//  SHOTS A — the dream (open), the menu + stamp (the turn), the cart at dusk (the end: the dream, small)
// =====================================================================
// 1. THE DREAM: a big restaurant at golden hour, "100 CABANG", a queue, fireworks; Juned in a chef's hat. Rewind at the end.
function sDream() {
  sunburst(540, 620, '#ffb21e', '#ff8a1f', 22, 'drSky');
  // fireworks (sparkles) popping on the beat
  for (let i = 0; i < 5; i++) { const t = 0.4 + i * 0.75, k = ev(t, 0.5); if (k <= 0 || k >= 1) continue; const R = RNG('fw', i), cx = R.r(160, 920), cy = R.r(300, 520); for (let j = 0; j < 10; j++) { const a = j / 10 * TAU; sparkle(cx + Math.cos(a) * 90 * k, cy + Math.sin(a) * 90 * k, 14 * (1 - k) + 4, ['#fff8dc', PAL.yellow, PAL.pinkL][j % 3]); } }
  birdsOnWire(330, 'drw');
  // the restaurant
  cut(rect(110, 720, 860, 640, 10), '#fff3d6', { key: 'drBld', pat: pat.lines('rgba(255,140,60,0.25)', 38) });
  cut([[70, 740], [1010, 740], [960, 640], [120, 640]], WN.red, { key: 'drRoof', pat: pat.stripes('rgba(255,255,255,0.3)', 30, 80), sb: 10 });
  // the big sign (orange = the warung)
  const sg = popS(0.3);
  ctx.save(); ctx.translate(540, 560); ctx.scale(sg, sg);
  cut(rect(-360, -90, 720, 170, 14), PAL.orange, { key: 'drSign', crayon: PAL.orangeD, crAl: 0.3, sb: 14 });
  handText('WARUNG NETIZEN', -handW('WARUNG NETIZEN', 78, 700) / 2, 28, 78, '#fff8ea', { key: 'drSignT', weight: 700 });
  for (let i = 0; i < 14; i++) dot(-340 + i * 52, -100, 9, (B + i) % 4 < 2 ? PAL.yellow : '#fff2c0');   // marquee bulbs
  ctx.restore();
  tag('100 CABANG!', 740, 800, 56, { fill: PAL.yellow, rot: 0.08, s: popS(1.2) });
  // windows with people inside, door
  [[170, 860], [390, 860], [690, 860]].forEach(([wx, wy], i) => { cut(rect(wx, wy, 190, 170, 6), '#7fe0ff', { key: 'drWin' + i, sb: 6 }); person(wx + 95, wy + 150, 0.35, { key: 'drIn' + i, shirt: [PAL.purple, PAL.teal, PAL.pink][i], mood: 'happy' }); });
  cut(rect(450, 1110, 180, 250, 6), PAL.woodD, { key: 'drDoor' });
  ground(1340, WN.road, 'drGround', { pat: pat.dots('rgba(120,90,60,0.15)', 4, 40) });
  // the queue
  for (let i = 0; i < 6; i++) { const qx = 680 + i * 70, hop = (B + i * 3) % 18 < 2 ? -10 : 0; person(qx, 1480 + hop, 0.42, { key: 'q' + i, shirt: [PAL.blue, PAL.green, PAL.purple, PAL.pink, PAL.mustard, PAL.teal][i], skin: [PAL.skin1, PAL.skin2, PAL.skin3][i % 3], mood: i % 2 ? 'happy' : 'smile' }); }
  juned(330, 1600, 0.95, { pose: 'proud', mood: 'happy', hat: 'chef', key: 'jDream' });
  // the rewind: scan lines and a ◀◀ tag in the last half second
  const rw = ev(TIMELINE.cues.rewind, 0.55);
  if (rw > 0) {
    ctx.save(); ctx.fillStyle = `rgba(30,20,40,${0.35 * rw})`; ctx.fillRect(0, 0, W, H);
    const R = RNG('scan', B); for (let i = 0; i < 9; i++) { const yy = R.r(0, H); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0, yy, W, R.r(4, 18)); }
    ctx.restore();
    DEFER.push(() => tag('<< MUNDUR', CX, 900, 90, { fill: PAL.paper, rot: -0.05, tape: false }));
  } else { yearTag('suatu hari nanti...'); }
}

// 7. THE MENU: the cart's empty menu board, Juned scratching his head; silence (a gecko, a leaf); STAMP at 36.25
function sMenu() {
  const st = TIMELINE.cues.stamp;
  sky(WN.skyA, WN.skyB, 'mnSky');
  cloud(220, 330, 1.1, 'mnC1'); cloud(860, 420, 0.8, 'mnC2');
  ground(1250, WN.grass, 'mnGround');
  gerobak(700, 1330, 1.0, { key: 'mnCart', parts: 9, tilt: -0.03 });
  // the menu board on its easel
  cut(capsulePts(260, 1500, 330, 860, 22), PAL.woodD, { key: 'mnLeg1' }); cut(capsulePts(560, 1500, 490, 860, 22), PAL.woodD, { key: 'mnLeg2' });
  cut(rect(170, 640, 480, 640, 12), PAL.wood, { key: 'mnFrame', pat: pat.grainWood('rgba(120,60,20,0.2)') });
  cut(rect(200, 670, 420, 580, 6), WN.chalk, { key: 'mnBoard', shadow: false, grain: 1.2 });
  handText('MENU:', 240, 760, 76, '#f4f1e6', { key: 'mnTitle', weight: 700 });
  for (let i = 0; i < 4; i++) ink([[240, 860 + i * 100], [580, 860 + i * 100]], { w: 4, color: 'rgba(244,241,230,0.45)', amt: 1.4, key: 'mnLine' + i });
  // the gecko crawls across the board during the silence; a leaf falls
  const gk = seg(TT, 34.4, 36.1);
  if (gk > 0 && gk < 1) { const gx = lerp(640, 160, gk), gy = 1000 + Math.sin(gk * 14) * 12; cut(ellipsePts(gx, gy, 34, 12, 0, 16), '#9bb36a', { key: 'gecko', sb: 3 }); cut(capsulePts(gx + 30, gy, gx + 80, gy + Math.sin(TT * 9) * 8, 9), '#9bb36a', { key: 'geckoT', sb: 3 }); dot(gx - 26, gy - 4, 3); }
  const lf = seg(TT, 33.0, 36.2); if (lf > 0 && lf < 1) leaf(860 + Math.sin(lf * 9) * 60, lerp(300, 1300, lf), lf * 6, 'mnLeaf', PAL.mustard);
  fly(860, 820, 'mnFly');
  // Juned: scratching (the question) -> wow (the stamp)
  const after = past(TT, st);
  juned(850, 1640, 0.9, { pose: after ? 'point' : 'scratch', mood: after ? 'wow' : 'sad', key: 'jMenu' });
  if (!after) { const q = popS(VW('masalah', 'nggak')); if (q > 0) { ctx.save(); ctx.translate(880, 900); ctx.scale(q, q); handText('?', 0, 0, 120, PAL.ink, { key: 'q1', weight: 700 }); ctx.restore(); } }
  // THE STAMP: drops from above on the hit, leaves a red stamp across the board
  if (TT >= st - 0.25) {
    const k = clamp((TT - (st - 0.25)) / 0.25);   // falling in the last 6 frames before the hit
    if (k < 1) { const yy = lerp(-500, 820, EZ.i2(k)); cut(rect(260, yy, 300, 120, 14), PAL.woodD, { key: 'stH' }); cut(rect(230, yy + 110, 360, 60, 6), WN.red, { key: 'stF' }); }
    else {
      const bk = EZ.back(ev(st, 0.3)); ctx.save(); ctx.translate(410, 960); ctx.scale(bk, bk); ctx.fillStyle = PAL.yellow;
      ctx.beginPath(); for (let i = 0; i < 28; i++) { const a = i / 28 * TAU, r = i % 2 ? 260 : 380; ctx.lineTo(Math.cos(a) * r * 1.15, Math.sin(a) * r * 0.85); } ctx.closePath(); ctx.fill(); ctx.restore();
      cut(rect(170, 820, 480, 290, 18), '#ffffff', { key: 'stPaper', tear: 1.6, sb: 14 });
      ctx.save(); ctx.translate(410, 960); ctx.rotate(-0.12);
      const ink2 = 'rgba(200,66,58,0.92)';
      ctx.strokeStyle = ink2; ctx.lineWidth = 12; trace(wobble(rrectPts(-250, -150, 500, 300, 20), true, 3, 'stB', 8), true); ctx.stroke();
      handText('KOMEN =', -handW('KOMEN =', 84, 700) / 2, -25, 84, ink2, { key: 'stT1', weight: 700 });

// =====================================================================
//  CAMERAS AND (NO) BRIDGES — hard cuts on the 8th grid (BRIDGES = []). A small shake on the stamp.
// =====================================================================
const ERA_BG = SHOT_LIST.map(() => '#efe5cf');
function pieceCam(era, t) {
  if (SHOT_LIST[era][1] === 'menu' && t >= STAMP_T && t < STAMP_T + 0.4) {
    const k = 1 - (t - STAMP_T) / 0.4, R = RNG('shake', Math.round(t * FPS));
    return { z: 1 + 0.03 * k, tx: R.n(28 * k) - 16 * k, ty: R.n(28 * k) - 28 * k };
  }
  return null;
}
const BRIDGES = [];

// =====================================================================
//  kit/morph.js — the renderer for pieces built from ERAS (scenes) joined by SHAPE MORPHS.
//
//  At each bridge time tc:
//    shrink [tc-d, tc-m]      the old era is seen through a window shaped like the bridge object (STYLE.window),
//                             shrinking onto the object while the backdrop fades to blank paper
//    morph  [tc-m, tc+m]      on blank paper, the object's outline blends into its counterpart's
//                             (both resampled by angle around their centroids; colour lerped). Hero-to-hero
//                             bridges draw the hero itself with blended position, size and ray count.
//    grow   [tc+m, tc+d]      the new era opens out of a window shaped like the counterpart
//    d = the bridge's half-length (default 0.6s, so a bridge costs 1.2s), m = the morph's half (default 0.2s, or d/3 when d is set).
//    Short pieces: { tc, d: 0.4 } (0.8s) or fewer bridges — see craft.md -> Transitions.
//  Era boundaries WITHOUT a bridge are hard cuts (keep at most one: the slam).
//
//  The piece defines (in its head / src):
//    ERA_LIST = [[t0, t1, () => drawScene()], ...]      scenes draw in world coords, call yearTag()/capStrip()
//    ERA_BG   = ['#hex', ...]                          each era's dominant colour (for the fade to paper)
//    BRIDGES  = [{ tc, A: () => shape, B: () => shape, d?, m? }]   shape = { P: points, c: '#hex' } or SP(x, y, r, rays)
//    function pieceCam(era, t) { return null | CAM }   optional; use push() / bump() below
//  Shapes are in each era's world coords; the bridge object must be in frame at tc (pull push-ins back first).
//  The look comes from the style kit's STYLE hooks (paper, backdrop, window, blob, hero, post, ones):
//  this file draws nothing itself, so the same piece structure works in any style.
// =====================================================================
// ---- cameras: CAM = { z, tx, ty }; camOf({ z, p, to }) puts world point p on screen point to
const CAM0 = { z: 1, tx: 0, ty: 0 };
const camOf = (c) => ({ z: c.z, tx: c.to[0] - c.z * c.p[0], ty: c.to[1] - c.z * c.p[1] });
const camMix = (a, b, u) => ({ z: lerp(a.z, b.z, u), tx: lerp(a.tx, b.tx, u), ty: lerp(a.ty, b.ty, u) });
// an eased push-in over [a, b] to cam, optionally pulled back over [oa, ob]
function push(t, a, b, cam, oa, ob) { let u = EZ.io(seg(t, a, b)); if (oa != null) u *= 1 - EZ.io(seg(t, oa, ob)); return u > 0 ? camMix(CAM0, camOf(cam), u) : null; }
// a zoom bump on every beat from t0, centred on point p (the hero keeps its screen spot)
function bump(t, t0, p, amt = 0.3, every = 0.5) { return camOf({ z: 1 + amt * Math.exp(-mod(t - t0, every) * 7), p, to: p }); }
function camAt(era, t) { return (typeof pieceCam === 'function' && pieceCam(era, t)) || CAM0; }
const camPts = (P, c) => P.map(([x, y]) => [c.z * x + c.tx, c.z * y + c.ty]);
// ---- bridge shapes
function starPts(x, y, r, n, r0 = -Math.PI / 2, m = 96) {
  const P = []; for (let i = 0; i < m; i++) { const a = i / m * TAU, k = 0.42 + 0.58 * (0.5 + 0.5 * Math.cos(n * (a - r0))) ** 3; P.push([x + Math.cos(a) * r * k, y + Math.sin(a) * r * k]); }
  return P;
}
const SP = (x, y, r, n) => ({ spark: [x, y, r, n] });
const shapeOf = (s) => (s.spark ? { P: (STYLE.heroPts || starPts)(...s.spark), c: STYLE.heroColor, spark: s.spark } : s);

    if (o.swellTo) g.gain.linearRampToValueAtTime(o.swellTo, o.swellAt);
    g.gain.setValueAtTime(hold, t1 - (o.rel ?? 0.3)); g.gain.exponentialRampToValueAtTime(0.0001, t1);
    notes.forEach((n, i) => { for (const det of [-7, 7]) { const oo = osc(o.type ?? 'sawtooth', nz(n), t0, t1 + 0.05); oo.detune.value = det + i; oo.connect(lp); } });
    lp.connect(g); out(g, o.pan ?? 0, o.send ?? 0.4);
  }
  function drone(t0, t1, f, peak, o = {}) {
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + (o.att ?? 0.5));
    g.gain.setValueAtTime(peak, t1 - (o.rel ?? 0.4)); g.gain.exponentialRampToValueAtTime(0.0001, t1);
    osc('sine', f, t0, t1 + 0.05).connect(g); out(g, 0, 0);
  }
  const claudeMotif = (t, notes, vel) => notes.forEach(([n, dt], i) => pluck(t + dt, nz(n), vel, -0.15 + i * 0.1, 0.6, 1300, 0.35));
  const childMotif = (t, notes, vel, bright = 5200, send = 0.3) => notes.forEach(([n, dt], i) => pluck(t + dt, nz(n), vel, 0.2 - i * 0.1, 0.32, bright, send));
  // ================= WARUNG NETIZEN DAY 1: the arc =================
  // a festive groove (the dream) -> rewind, cut dead -> crickets (Day 1) -> a sad pad and rain (laid off)
  // -> coins (Rp500k), a "kring" on the cart -> the groove comes back light with hammer hits (building)
  // -> chalk -> the groove thins (the empty menu) -> DEAD SILENCE 34.75-36.25 -> the STAMP (the loudest hit)
  // -> a cheerful groove under the rules -> pencil -> a warm chord at dusk and Juned's motif.
  // The voice sits on top (piece.json voice.music = -12 dB, ducked under speech).
  const T = TIMELINE, cu = T.cues;
  const each = (t0, t1, step, fn) => { for (let k = 0; t0 + k * step < t1 - 1e-6; k++) fn(t0 + k * step, k); };
  const FIG = [['C4', 'E4', 'G4', 'E4', 'C5', 'G4', 'E4', 'G4'], ['A3', 'C4', 'E4', 'C4', 'A4', 'E4', 'C4', 'E4'],
               ['F3', 'A3', 'C4', 'A3', 'F4', 'C4', 'A3', 'C4'], ['G3', 'B3', 'D4', 'B3', 'G4', 'D4', 'B3', 'D4']];
  const ROOT = ['C2', 'A1', 'F1', 'G1'];

  // the groove: 8th plucks over a bar-by-bar progression, bass on beats, a shaker on off-beats
  function groove(t0, t1, vel, o = {}) {

      if (!o.sparse || k % 2 === 0) pluck(t, nz(fig[k % 8]), vel * acc, Math.sin(k * 0.9) * 0.3, 0.28, 3600, 0.18);

    });
  }

  // ================= MUSIC =================
  to = 'm';
  // 1. the dream: festive, full, fireworks on the beat; then a tape-rewind sweep down and a dead stop
  pad(0.0, 4.2, ['C3', 'G3', 'E4'], 0.02, { cut: 1400, att: 0.1, rel: 0.05, send: 0.3 });
  groove(0.0, 4.25, 0.048, { shaker: true });
  for (let i = 0; i < 5; i++) chime(0.4 + i * 0.75, [nz('C6'), nz('G6')], 0.03, (i % 2 ? 0.4 : -0.4));
  to = 's'; sweep(cu.rewind, 4.7, 0.05, 3200, 180); to = 'm';
  // 2. Day 1: crickets and one lonely pluck figure; Juned's motif when the DAY 1 tag pops
  pad(4.75, 9.25, ['C3', 'G3'], 0.016, { type: 'triangle', cut: 700, att: 0.6, rel: 0.4 });
  motif(VW('day1', 'hari'), 0.07);
  // 3. laid off: a sad pad in A minor, a slow falling line
  pad(9.25, 15.0, ['A2', 'E3', 'C4'], 0.028, { type: 'triangle', cut: 800, att: 0.5, rel: 0.4, send: 0.5 });
  [9.5, 10.5, 11.5, 12.5, 13.5].forEach((t, i) => pluck(t, nz(['E5', 'D5', 'C5', 'B4', 'A4'][i]), 0.04, 0.2 - i * 0.1, 0.9, 1800, 0.5));
  // 4. Rp500k: a light walking figure
  pad(15.0, 20.25, ['F3', 'C4', 'A4'], 0.022, { type: 'triangle', cut: 1000, att: 0.3, rel: 0.3 });
  each(15.0, 20.25, BEAT, (t, k) => pluck(t, nz(['F4', 'A4', 'C5', 'A4'][k % 4]), 0.045, 0, 0.3, 2600, 0.2));
  // 5. building: the groove comes back, light
  groove(20.25, 26.75, 0.05, { sparse: true });
  pad(20.25, 26.75, ['C3', 'G3', 'E4'], 0.02, { cut: 1000, att: 0.4, rel: 0.3 });
  // 6. the board: just a held chord and a tick
  pad(26.75, 30.75, ['F3', 'C4', 'A4'], 0.022, { type: 'triangle', cut: 900, att: 0.3, rel: 0.3 });
  // 7. the empty menu: the groove thins out and everything stops dry before 34.75 (the silence)
  groove(30.75, 34.5, 0.045, { sparse: true });
  pad(30.75, 34.7, ['A2', 'E3', 'G3'], 0.02, { type: 'triangle', cut: 700, att: 0.2, rel: 0.6, send: 0.05 });
  // 8. THE STAMP (payoff recipe: a short stab + sub on the hit, a flat chord after it)
  chime(cu.stamp, [nz('C5'), nz('E5'), nz('G5'), nz('C6')], 0.13); sub(cu.stamp, 0.55);
  pad(cu.stamp + 0.05, 40.0, ['C3', 'G3', 'C4', 'E4'], 0.03, { cut: 1300, att: 0.3, rel: 0.3, send: 0.4 });
  motif(VW('tentukan', 'tentukan') + 0.4, 0.08);
  // 9. the rules: the cheerful groove, full
  groove(40.0, 47.75, 0.055, { shaker: true });
  pad(40.0, 47.75, ['C3', 'G3', 'E4'], 0.022, { cut: 1200, att: 0.3, rel: 0.3 });
  // 10. the credit book: soft, the groove without the plucks' 8ths
  pad(47.75, 52.75, ['F3', 'A3', 'C4', 'E4'], 0.016, { type: 'triangle', cut: 900, att: 0.4, rel: 0.4, send: 0.5 });
  each(47.75, 52.75, BEAT, (t, k) => pluck(t, nz(['A4', 'C5', 'E5', 'C5'][k % 4]), 0.022, Math.sin(k) * 0.3, 0.5, 2400, 0.4));
  // 11. dusk: a warm chord, the motif on "pertama", a last chime
  pad(52.75, 58.75, ['C3', 'G3', 'E4', 'G4'], 0.017, { cut: 1100, att: 0.6, rel: 1.2, send: 0.6 });
  motif(cu.one, 0.06);
  chime(56.0, [nz('C5'), nz('G5'), nz('E6')], 0.03);

  // ================= SOUND EFFECTS =================
  to = 's';
  // crickets in Day 1: paired chirps
  each(4.9, 9.1, 0.5, (t, k) => { noiseHit(t, 0.03, 'bandpass', 4200, 9, 0.025, 0.4); noiseHit(t + 0.08, 0.03, 'bandpass', 4300, 9, 0.022, 0.4); });
  // rain under the little cloud
  each(VW('phk', 'kena'), 15.0, 0.06, (t, k) => noiseHit(t, 0.04, 'highpass', 3000 + (k % 5) * 400, 0.8, 0.012, Math.sin(k) * 0.5));
  // five notes counted out, then "kring" on the cart ad
  for (let i = 0; i < 5; i++) blip(VW('modal', 'lima') + i * 0.2, 900 + i * 120, 1300 + i * 120, 0.06, 0.05);
  chime(VW('modal', 'gerobak'), [nz('E6'), nz('B6')], 0.06, 0.2);
  // hammer hits while building; "toing" on the bent wheel; the bell on "usaha"
  each(20.4, VW('gerobak', 'namanya') - 0.2, BEAT, (t) => { noiseHit(t, 0.06, 'bandpass', 900, 2, 0.08, 0.2); sub(t, 0.05); });
  blip(VW('gerobak', 'miring'), 300, 900, 0.25, 0.08);
  chime(VW('gerobak', 'usaha'), [nz('A6')], 0.06, 0.3); chime(VW('gerobak', 'usaha') + 0.3, [nz('A6')], 0.05, 0.3);
  // chalk scratches with the write-ons
  [[VW('papan', 'pelanggan') - 0.1, 0.5], [VW('papan', 'omzet') - 0.1, 0.4]].forEach(([t0, d]) => each(t0, t0 + d, 0.06, (t, k) => noiseHit(t, 0.05, 'highpass', 5000, 1.5, 0.02, 0)));
  // the gecko's little feet, then nothing; the stamp's thud is in the music (sub + chime)
  noiseHit(cu.stamp, 0.18, 'lowpass', 400, 0.8, 0.2, 0);
  // a pop for each order slip
  [VW('aturan1', 'follow'), VW('aturan1', 'komen'), VW('aturan2', 'komen')].forEach((t, i) => blip(t, 500 + i * 200, 1200 + i * 200, 0.08, 0.06, (i - 1) * 0.3));
  // pencil on "kamu"
  each(VW('bon', 'kamu') - 0.2, VW('bon', 'kamu') + 0.4, 0.05, (t) => noiseHit(t, 0.04, 'bandpass', 2500, 1.2, 0.02, -0.2));
  // the counter 0 -> 1
  blip(cu.one, 700, 1400, 0.12, 0.06);
  to = 'm';
  // =====================================================================
  //  kit/score-tail.js — render, fold the tail over the loop point, loudness stage
  //  (RMS-normalise to -17 dBFS, look-ahead limiter at -1 dBFS; stems share the mix gain curve)
  // =====================================================================
  const buf = await ac.startRendering();
  // fold the tail over the loop point so the loop is seamless
  const N = Math.round(LOOP_T * sampleRate), L = new Float32Array(N), Rr = new Float32Array(N);
  const c0 = buf.getChannelData(0), c1 = buf.getChannelData(1);
  for (let i = 0; i < N; i++) { L[i] = c0[i] + (i + N < len ? c0[i + N] : 0); Rr[i] = c1[i] + (i + N < len ? c1[i + N] : 0); }
  // loudness for a phone (subagents-short): RMS-normalise to -17 dBFS, then a look-ahead limiter at -1 dBFS.
  // Stems reuse the mix's gain and gain curve, so they sum back to the mix.
  let k = normIn?.k, g = normIn?.g;
  if (!g) {
    let sum = 0; for (let i = 0; i < N; i++) sum += (L[i] * L[i] + Rr[i] * Rr[i]) / 2;
    k = 10 ** (-17 / 20) / Math.sqrt(sum / N || 1e-12);
    const ceil = 0.89; g = new Float32Array(N);
    for (let i = 0; i < N; i++) { const p = Math.max(Math.abs(L[i]), Math.abs(Rr[i])) * k; g[i] = p > ceil ? ceil / p : 1; }
    const att = Math.exp(-1 / (0.0015 * sampleRate)), rel = Math.exp(-1 / (0.09 * sampleRate));
    for (let i = N - 2; i >= 0; i--) g[i] = Math.min(g[i], 1 - (1 - g[i + 1]) * att);
    let r = 1; for (let i = 0; i < N; i++) { r = Math.min(g[i], 1 - (1 - r) * rel); g[i] = r; }
  }
  for (let i = 0; i < N; i++) { L[i] *= k * g[i]; Rr[i] *= k * g[i]; }

}
function wavB64(s) {

}
async function renderAudioWav() { return wavB64(await buildScore(48000, 'mix')); }
async function renderAudioStems() {
  const mix = await buildScore(48000, 'mix');
  const music = await buildScore(48000, 'music', mix.norm), sfx = await buildScore(48000, 'sfx', mix.norm);
  return { music: wavB64(music), sfx: wavB64(sfx) };
}
window.renderAudioWav = renderAudioWav;
window.renderAudioStems = renderAudioStems;
